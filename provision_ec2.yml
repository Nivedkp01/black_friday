---
- name: Provision EC2 Instance
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    instance_count: 2
    region: "us-east-1"
    ami_id: "ami-0440d3b780d96b29d"
    instance_type: "t3.micro"
  
  tasks:
    - name: setup sg for the ec2_instance
      amazon.aws.ec2_security_group:
        name: "friday-sg"
        description: "Security group for Ansible provisioned EC2 instances"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: 0.0.0.0/0
          - proto: tcp            
            from_port: 80
            to_port: 80
            cidr_ip:  0.0.0.0/0
      register: sg_result

    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        name: "my-ec2-instance-{{item}}"
        key_name: "ansible-key"
        instance_type: "{{instance_type}}"
        image_id: "{{ami_id}}"
        region: "{{region}}"
        vpc_subnet_id: "subnet-016c0eff1f1e1f785"
        security_group: "{{ sg_result.group_id }}"
        wait: yes
      loop: "{{ range(1, instance_count + 1) | list }}"
      register: ec2_instance
    
    - name: Add new instance to host group
      add_host:
        hostname: "{{ item.public_ip_address }}" # Note: changed 'public_ip' to 'public_ip_address'
        groups: "new_servers"
      loop: "{{ ec2_results.instances | default(ec2_instance.results | map(attribute='instances') | flatten) }}"

# --- SECOND PLAY STARTS HERE (No indentation) ---
- name: Configure new servers
  hosts: new_servers
  gather_facts: false
  tasks:
    - name: Wait for connection
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
        
    - name: Install Apache
      ansible.builtin.yum:
        name: httpd
        state: present
        
    - name: Start Apache service
      ansible.builtin.service:
        name: httpd
        state: started
